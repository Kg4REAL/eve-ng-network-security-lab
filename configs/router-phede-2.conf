!
! =========================================================
! Device: phede-2
! Role  : Distribution Switch (Layer 3)
!
! STP Root      : VLAN 30,40
! HSRP Active   : VLAN 30,40
! HSRP Standby  : VLAN 10,20
!
! Features:
! - Inter-VLAN Routing
! - RSTP (Rapid-PVST)
! - EtherChannel (LACP)
! - HSRP Load-Balancing
! - VTP Client
! =========================================================
!

hostname phede-2

! ---------------- VLAN CONFIGURATION ----------------
vlan 10
 name RG
vlan 20
 name MARKETING
vlan 30
 name DRH
vlan 40
 name GUEST

! ---------------- SPANNING TREE ----------------
spanning-tree mode rapid-pvst
spanning-tree vlan 1,10,20 priority 8192
spanning-tree vlan 30,40 priority 4096

! ---------------- LAYER 3 ROUTING ----------------
ip routing

interface Vlan10
 ip address 192.168.10.2 255.255.255.0
 standby 10 ip 192.168.10.254
 standby 10 priority 100
 standby 10 preempt
 no shutdown

interface Vlan20
 ip address 192.168.20.2 255.255.255.0
 standby 20 ip 192.168.20.254
 standby 20 priority 100
 standby 20 preempt
 no shutdown

interface Vlan30
 ip address 192.168.30.2 255.255.255.0
 standby 30 ip 192.168.30.254
 standby 30 priority 110
 standby 30 preempt
 no shutdown

interface Vlan40
 ip address 192.168.40.2 255.255.255.0
 standby 40 ip 192.168.40.254
 standby 40 priority 110
 standby 40 preempt
 no shutdown

! ---------------- ETHERCHANNEL ----------------
interface range Ethernet0/0 - 1
 channel-protocol lacp
 channel-group 3 mode active
 no shutdown

interface Port-channel3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30,40

interface range Ethernet0/2 - 3
 channel-protocol lacp
 channel-group 2 mode active
 no shutdown

interface Port-channel2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30,40

! ---------------- VTP ----------------
vtp domain CPS-LAB
vtp mode client
vtp password cisco
vtp version 2

