!
! =========================================================
! Device: phede-1
! Role  : Distribution Switch (Layer 3)
!
! STP Root      : VLAN 1,10,20
! HSRP Active   : VLAN 10,20
! HSRP Standby  : VLAN 30,40
!
! Features:
! - Inter-VLAN Routing
! - RSTP (Rapid-PVST)
! - EtherChannel (LACP)
! - HSRP Load-Balancing
! - DHCP Server (VLAN 10)
! =========================================================
!

hostname phede-1

! ---------------- VLAN CONFIGURATION ----------------
vlan 10
 name RG
vlan 20
 name MARKETING
vlan 30
 name DRH
vlan 40
 name GUEST

! ---------------- SPANNING TREE ----------------
spanning-tree mode rapid-pvst
spanning-tree vlan 1,10,20 priority 4096
spanning-tree vlan 30,40 priority 8192

! ---------------- LAYER 3 ROUTING ----------------
ip routing

interface Vlan10
 ip address 192.168.10.1 255.255.255.0
 standby 10 ip 192.168.10.254
 standby 10 priority 110
 standby 10 preempt
 no shutdown

interface Vlan20
 ip address 192.168.20.1 255.255.255.0
 standby 20 ip 192.168.20.254
 standby 20 priority 110
 standby 20 preempt
 no shutdown

interface Vlan30
 ip address 192.168.30.1 255.255.255.0
 standby 30 ip 192.168.30.254
 standby 30 priority 100
 standby 30 preempt
 no shutdown

interface Vlan40
 ip address 192.168.40.1 255.255.255.0
 standby 40 ip 192.168.40.254
 standby 40 priority 100
 standby 40 preempt
 no shutdown

! ---------------- ETHERCHANNEL ----------------
interface range Ethernet0/0 - 1
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown

interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30,40

interface range Ethernet0/2 - 3
 channel-protocol lacp
 channel-group 4 mode active
 no shutdown

interface Port-channel4
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20,30,40

! ---------------- VTP ----------------
vtp domain CPS-LAB
vtp mode server
vtp password cisco
vtp version 2

! ---------------- DHCP (VLAN 10 ONLY) ----------------
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.10.254

ip dhcp pool VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.254
 dns-server 8.8.8.8

